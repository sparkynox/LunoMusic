name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Decode keystore
        env:
          KS: ${{ secrets.LUNOMUSIC_KEYSTORE_BASE64 }}
        run: echo -n "$KS" | base64 -d > app/release.jks

      - name: Build release apk
        env:
          KEYSTORE_PASSWORD: ${{ secrets.LUNOMUSIC_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LUNOMUSIC_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.LUNOMUSIC_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: LunoMusic-release
          path: app/build/outputs/apk/release/*.apk
